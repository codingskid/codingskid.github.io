
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>
    <p>Choose a page below:</p>

    <div class="buttons">
        <button onclick="window.location.href='test1.html'">
            Test 1
        </button>

        <button onclick="window.location.href='test2.html'">
            Test 2
        </button>

        <button onclick="window.location.href='test3.html'">
            Test 3
        </button>
    </div>

</body>
</html>
